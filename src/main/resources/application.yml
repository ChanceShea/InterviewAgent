server:
  port: 8888
  servlet:
    context-path: /api

spring:
  application:
    name: InterviewAgent
  datasource:
    url: jdbc:postgresql://192.168.100.104:5432/ai_agent_code
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  ai:
    vectorstore:
      pgvector:
        index-type: hnsw
        distance-type: cosine_distance
        initialize-schema: true
  profiles:
    active: local
  data:
    redis:
      host: 192.168.100.104
      port: 6379
      database: 0
      password: xgw18720322169.
      lettuce:
        pool:
          # 连接池最大连接数
          max-active: 200
          # 连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: 60s
          # 连接池中的最大空闲连接
          max-idle: 10
          # 连接池中的最小空闲连接
          min-idle: 0
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: is_deleted
      logic-not-delete-value: 0
      logic-delete-value: 1
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    web: info

rag:
  autoLoad: true
  batchSize: 1

interview-agent:
  checkpoint:
    type: memory

